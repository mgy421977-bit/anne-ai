name: ANNE AI → Dropbox Sync

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dropbox SDK
        run: python -m pip install --upgrade "dropbox>=12.0.0"

      - name: Mirror repository to Dropbox
        env:
          ANNE_DROPBOX_APP_KEY: ${{ secrets.ANNE_DROPBOX_APP_KEY }}
          ANNE_DROPBOX_SYNC_REFRESH_TOKEN: ${{ secrets.ANNE_DROPBOX_SYNC_REFRESH_TOKEN }}
          ANNE_DROPBOX_SYNC_ROOT: /ANNE AI
        run: python scripts/sync_repo_to_dropbox.py
