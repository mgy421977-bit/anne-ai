name: Scrapling Integration Proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrapling-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,research]"

      - name: Run Scrapling integration proof
        run: python -m pytest -q tests/integration/test_scrapling_e2e.py
