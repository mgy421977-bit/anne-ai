name: Actions Storage Cleanup

on:
  workflow_dispatch:
    inputs:
      run_ids:
        description: "Comma-separated workflow run IDs to delete after review"
        required: true
        type: string
      confirm:
        description: "Type DELETE to confirm the reviewed run IDs"
        required: true
        type: string

permissions:
  actions: write

jobs:
  cleanup:
    if: ${{ inputs.confirm == 'DELETE' }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete explicitly approved workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_IDS: ${{ inputs.run_ids }}
        run: |
          set -euo pipefail

          IFS=',' read -ra IDS <<< "${RUN_IDS}"
          for run_id in "${IDS[@]}"; do
            run_id="${run_id//[[:space:]]/}"
            if [[ ! "${run_id}" =~ ^[0-9]+$ ]]; then
              echo "Invalid workflow run ID: ${run_id}"
              exit 1
            fi
            echo "Deleting explicitly approved workflow run ${run_id}"
            gh api --method DELETE "repos/${GH_REPO}/actions/runs/${run_id}"
          done

          echo "Approved Actions cleanup completed."
